<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 知识图谱 logo：中心枢纽 + 卫星节点 + 连线（2026-11-26 用户换标）。
       主题蓝 #2563EB 为主，辅点蓝阶 #60A5FA/#93C5FD，一枚绿点 #22C55E
       呼应图谱类型色与旧版叶子绿。线性 2px 圆头描边，与 lucide 图标同语言 -->
  <g stroke="#2563EB" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="16" x2="7" y2="8"/>
    <line x1="16" y1="16" x2="25" y2="7" opacity="0.5"/>
    <line x1="16" y1="16" x2="25" y2="25"/>
    <line x1="16" y1="16" x2="7" y2="25" opacity="0.5"/>
  </g>
  <circle cx="16" cy="16" r="4.5" fill="#2563EB"/>
  <circle cx="16" cy="16" r="1.6" fill="#FFFFFF"/>
  <circle cx="7" cy="8" r="3" fill="#60A5FA"/>
  <circle cx="25" cy="7" r="2.5" fill="#22C55E"/>
  <circle cx="25" cy="25" r="3" fill="#60A5FA"/>
  <circle cx="7" cy="25" r="2.5" fill="#93C5FD"/>
</svg>
