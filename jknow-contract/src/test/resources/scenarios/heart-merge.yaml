# 域：heart-merge——实体合并无孤儿（规格 §5）。
#
# 语义：decide_review store 层合并后无悬空引用——合并十步事务把事实/证据/限定/审核改指到
# 存活者（evidence/qualifier/review 改指），entity_merges 留痕，被并者的名字成又名事实；
# 快照全表深度比对自然覆盖孤儿检查。
#
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin）；login 步随源仓 auth 域退役；
# kb 固定装置 SQL 桥接 jknow 身份（organizations 最老行 + sys_user.user_id=1 的
# utopia_uuid，与业务面折算同口径），${run_id} 唯一后缀保留。
#
# 挂账退役（WAIVERS.md，step-auth-override-dead）：push-obs-1（Bearer 来源密钥推送三实体
# 两陈述一带限定词一别名——引擎 bearer 恒占第一个 Authorization 头，步级覆盖落空，实录已证
# 401）及其下游 review-fixture/review-decide-merge（消解审核前提按推送实体名 Orion/Meridian
# 定位——推送死后 INSERT..SELECT 空集、store 裁决无 review_id 可引）。本剧本剩装置+快照骨架；
# 合并无孤儿证据待引擎步级鉴权扩展后恢复。
name: heart-merge
desc: 实体合并无孤儿（推送挂账退役后为装置+快照骨架）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: kb-fixture
    sql:
      statements:
        - |
          INSERT INTO workspaces (id, org_id, name)
          SELECT gen_random_uuid(),
                 (SELECT o.id FROM organizations o ORDER BY o.created_at LIMIT 1),
                 'ws-merge-${run_id}'
          RETURNING id AS ws_id
        - |
          INSERT INTO knowledge_bases (id, workspace_id, name, ontology_lang,
                                       inference_interval_minutes, last_inference_at)
          VALUES (gen_random_uuid(), '${ws_id}'::uuid, 'kb-merge-${run_id}', 'en', 10080, now())
          RETURNING id AS kb_id
        - |
          INSERT INTO memberships (user_id, workspace_id, role)
          SELECT (SELECT su.utopia_uuid FROM sys_user su WHERE su.user_id = 1),
                 '${ws_id}'::uuid, 'owner'
          RETURNING user_id AS user_id
        # kb 成员矩阵（写权限的唯一来源）：建库 HTTP 给创建者 admin，SQL 装置对等补上
        - |
          INSERT INTO kb_members (kb_id, user_id, role)
          VALUES ('${kb_id}'::uuid, '${user_id}'::uuid, 'admin')
      capture: { ws_id: ws_id, kb_id: kb_id, user_id: user_id }
  - id: statements-source
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-merge" }'
    capture:
      src_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
  # 挂账退役：push-obs-1 / review-fixture（namesake 审核前提）/ review-decide-merge
  # （store 步裁决 action=merge）——见文件头与 WAIVERS.md
  # 终态快照：entities（merged_into/又名搬运）/entity_merges/facts/fact_evidence/
  # statement_qualifiers/resolution_reviews（推送退役后为空集现状骨架）
  - id: merge-snapshot
    snapshot: { kb_id: '${kb_id}' }
