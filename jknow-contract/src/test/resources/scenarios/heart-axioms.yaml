# 域：heart-axioms——互斥违规进公理队列且仅此条（规格 §5）。
#
# 语义两半：
#   ①同名不并——本体声明互斥（entity_type_disjoint）后，同名不同类的两次观测各自成实体
#     （消解的 declared_disjoint_from 递归 CTE 判 Disjoint：候选忽略、不并、不提议）；
#   ②违规恰一条——works_at 声明 functional 后，同一主语两段重叠区间指向两个宾语
#     （Ivy works_at Ferrum 2021-2023；Ivy works_at Acme 2022-2024）→ 公理检查出一组
#     functional clash，settle 进 axiom_violations 恰一行（半开区间交集 2022-2023 非空）。
#
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin）；login 步随源仓 auth 域退役；
# kb 固定装置 SQL 桥接 jknow 身份（organizations 最老行 + sys_user.user_id=1 的
# utopia_uuid，与业务面折算同口径），${run_id} 唯一后缀保留。
#
# 挂账退役（WAIVERS.md，step-auth-override-dead）：push-obs-1/push-obs-2 两步观测推送
# （Bearer 来源密钥鉴权，引擎 bearer 恒占第一个 Authorization 头、步级覆盖落空，实录已证
# 401）——观测死后类型化/公理违规无输入，快照为空集现状骨架；信封证据待引擎步级鉴权
# 扩展后恢复。
name: heart-axioms
desc: 互斥声明同名不并 + functional 重叠双值恰一条公理违规（推送挂账退役后为装置+快照骨架）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: kb-fixture
    sql:
      statements:
        - |
          INSERT INTO workspaces (id, org_id, name)
          SELECT gen_random_uuid(),
                 (SELECT o.id FROM organizations o ORDER BY o.created_at LIMIT 1),
                 'ws-axioms-${run_id}'
          RETURNING id AS ws_id
        - |
          INSERT INTO knowledge_bases (id, workspace_id, name, ontology_lang,
                                       inference_interval_minutes, last_inference_at)
          VALUES (gen_random_uuid(), '${ws_id}'::uuid, 'kb-axioms-${run_id}', 'en', 10080, now())
          RETURNING id AS kb_id
        - |
          INSERT INTO memberships (user_id, workspace_id, role)
          SELECT (SELECT su.utopia_uuid FROM sys_user su WHERE su.user_id = 1),
                 '${ws_id}'::uuid, 'owner'
          RETURNING user_id AS user_id
        # kb 成员矩阵（写权限的唯一来源）：建库 HTTP 给创建者 admin，SQL 装置对等补上
        - |
          INSERT INTO kb_members (kb_id, user_id, role)
          VALUES ('${kb_id}'::uuid, '${user_id}'::uuid, 'admin')
      capture: { ws_id: ws_id, kb_id: kb_id, user_id: user_id }
  - id: statements-source
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-axioms" }'
    capture:
      src_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
  # 本体三个类 + 互斥声明（company 与 agency disjoint——建 agency 时带上）
  - id: type-person
    call: 'POST /api/v1/kbs/${kb_id}/ontology/entity-types { "key": "person", "label": "Person" }'
    capture: { person_type: body.id }
    expect: { status: 200 }
  - id: type-company
    call: 'POST /api/v1/kbs/${kb_id}/ontology/entity-types { "key": "company", "label": "Company" }'
    capture: { company_type: body.id }
    expect: { status: 200 }
  - id: type-agency
    call: 'POST /api/v1/kbs/${kb_id}/ontology/entity-types { "key": "agency", "label": "Agency", "disjoint": ["${company_type}"] }'
    capture: { agency_type: body.id }
    expect: { status: 200 }
  # works_at 先不带公理（functional 后面经 PATCH 加——公理检查的触发点）
  - id: relation-works-at
    call: 'POST /api/v1/kbs/${kb_id}/ontology/relation-types { "key": "works_at", "label": "Works At", "temporal": "state" }'
    capture: { rel_id: body.id }
    expect: { status: 200 }
  # 类别词→类（SQL 装置：绑定后推送的 e 类别词给实体定类——同名不并与 functional 违规
  # 都以「实体有类」为前提）
  - id: kind-word-bindings
    sql:
      statements:
        - |
          INSERT INTO type_bindings (id, kb_id, kind_word, type_id, status, decided_by)
          VALUES (gen_random_uuid(), '${kb_id}'::uuid, 'person', '${person_type}'::uuid, 'bound', 'person'),
                 (gen_random_uuid(), '${kb_id}'::uuid, 'company', '${company_type}'::uuid, 'bound', 'person'),
                 (gen_random_uuid(), '${kb_id}'::uuid, 'agency', '${agency_type}'::uuid, 'bound', 'person')
      capture: {}
  # 挂账退役：push-obs-1/push-obs-2（两份观测——functional 违规的两条边与同名不并的
  # 类型漂移输入）——见文件头与 WAIVERS.md；wait-obs-1 保留（后台链静默口径不变）
  - id: wait-obs-1
    wait: { kb_id: '${kb_id}' }
  # 短语绑定 + 物化 job
  - id: bind-and-materialize
    sql:
      wait_quiet: '${kb_id}'
      statements:
        - |
          INSERT INTO phrase_bindings (id, kb_id, phrase, subject_type_id, object_type_id,
                                       object_is_value, relation_type_id, direction, status, decided_by)
          VALUES (gen_random_uuid(), '${kb_id}'::uuid, 'works_at',
                  '${person_type}'::uuid, '${company_type}'::uuid, false,
                  '${rel_id}'::uuid, 'forward', 'bound', 'person')
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize
    wait: { kb_id: '${kb_id}' }
  # 公理触发点（本体改判据 → reconcile 同事务收/开违规行）：works_at 声明 functional——
  # 空图现状下 reconcile 无违规可收（原语义的两条边随推送退役），触发面本身仍被走到
  - id: works-at-declare-functional
    call: 'PATCH /api/v1/kbs/${kb_id}/ontology/relation-types/${rel_id} { "key": "works_at", "label": "Works At", "temporal": "state", "functional": true }'
    expect: { status: 200 }
  # 终态快照：axiom_violations/entity_type_disjoint/entities/facts+typed_fact_sources/
  # resolution_reviews——公理面终态裁决（推送退役后为空集现状骨架）
  - id: axioms-snapshot
    snapshot: { kb_id: '${kb_id}' }
