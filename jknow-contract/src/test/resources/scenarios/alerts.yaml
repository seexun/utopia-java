# 域：alerts——告警中心四操作 + 已读组标记。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）；
# admin 账号本身不产新告警（本剧本不建库不摄入），read-all 把既有未读清零后未读数恒 0。
# 告警流 /alerts/events 是 SSE：未认证 401 用例在 auth 剧本，已认证的流式行为 deferred（见 COVERAGE.md）。
name: alerts
desc: 告警列表/搜索/未读/全部已读/分组已读（ruoyi admin，既有告警只读不新增）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: alerts-page
    call: GET /api/v1/alerts?limit=10&offset=0
    expect: { status: 200 }
  - id: alerts-search-no-match
    call: GET /api/v1/alerts?q=nothing-matches-this&limit=5&offset=0
    expect: { status: 200 }
  - id: alerts-unread
    call: GET /api/v1/alerts/unread
    expect: { status: 200 }
  - id: alerts-read-all
    call: POST /api/v1/alerts/read-all
    expect: { status: 200 }
    target: rust
  - id: alerts-unread-after-read-all
    call: GET /api/v1/alerts/unread
    expect: { status: 200 }
  - id: alerts-read-group
    call: 'POST /api/v1/alerts/read-group { "kb_id": null, "kind": "doc.missing", "from": "2020-01-01T00:00:00Z", "to": "2030-01-01T00:00:00Z" }'
    expect: { status: 200 }
    target: rust
  - id: alerts-read-group-missing-range
    call: 'POST /api/v1/alerts/read-group { "kb_id": null, "kind": "doc.missing" }'
    expect: { status: 422 }
    target: rust
