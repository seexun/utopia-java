# 域：workspace-kb——工作区/库全生命周期、成员（两级）、审计、readiness、导出、工作区设置。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）。
# 幂等：开头自建专属工作区 ws-contract-wskb 与库 kb-contract-wskb（名字带剧本名），结尾删除工作区收尾；
# 每轮重建全新对象，不依赖上一轮。第二用户走 SQL 步预建（同 graph.yaml 的共享 contract_viewer
# 固定 utopia_uuid）——viewer-* 身份步（kb-hidden/read-ok/write-forbidden）因引擎单 token 模型
# 不可达（服务端取第一个 Authorization 头=setup token），走 WAIVERS.md 挂账
# （multi-user-single-token，规格开放点见任务 2 报告）；两级成员矩阵四步以 admin 身份保留。
# 原 /api/v1/auth/login|me 会话步（viewer-login-first/second、viewer-me、owner-login-back×2）
# 随源仓 auth 域退役（jknow 无路由），不再出现在剧本里。
# kb-create-with-packs 建库带 w3c-org 包走真导入（包体 13 类落本体，jknow 实装同源仓 M5 形）。
name: workspace-kb
desc: 工作区/库 CRUD+成员矩阵+审计+readiness+export+设置（自建 ws-contract-wskb/kb-contract-wskb）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: workspaces-list-before
    call: GET /api/v1/workspaces
    expect: { status: 200 }
  - id: ws-create
    call: 'POST /api/v1/workspaces { "name": "ws-contract-wskb" }'
    capture: { ws_id: body.id }
    expect: { status: 200 }
  - id: ws-get
    call: GET /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
  - id: ws-rename
    call: 'PATCH /api/v1/workspaces/${ws_id} { "name": "ws-contract-wskb-renamed" }'
    expect: { status: 200 }
  - id: ws-kbs-empty
    call: GET /api/v1/workspaces/${ws_id}/kbs
    expect: { status: 200 }
  - id: kb-create
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-wskb", "description": "contract scenario kb" }'
    capture: { kb_id: body.id }
    expect: { status: 200 }
  - id: ws-kbs-one
    call: GET /api/v1/workspaces/${ws_id}/kbs
    expect: { status: 200 }
  - id: kb-get
    call: GET /api/v1/kbs/${kb_id}
    expect: { status: 200 }
  - id: kb-patch
    call: 'PATCH /api/v1/kbs/${kb_id} { "description": "contract scenario kb patched" }'
    expect: { status: 200 }
  - id: ontology-packs
    call: GET /api/v1/ontology-packs
    expect: { status: 200 }
  # 建库带包（install_packs 逐包 owl_import::apply，w3c-org 13 类）——422 降级退役后已接真
  - id: kb-create-with-packs
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-wskb-packs", "ontology_packs": ["w3c-org"] }'
    capture: { kb_packs_id: body.id }
    expect: { status: 200 }
  - id: kb-packs-ontology
    call: GET /api/v1/kbs/${kb_packs_id}/ontology
    expect: { status: 200 }    # 包装没装上一读便知（收尾 ws-delete 级联清掉）
  - id: my-kbs
    call: GET /api/v1/workspaces/${ws_id}/my-kbs
    expect: { status: 200 }
  - id: kb-members-initial
    call: GET /api/v1/kbs/${kb_id}/members
    expect: { status: 200 }
  - id: ws-members-initial
    call: GET /api/v1/workspaces/${ws_id}/members
    expect: { status: 200 }
  # ---- 第二用户（SQL 预建，不登录——单 token 模型下身份步不可达，见文件头）----
  # 原 viewer-kb-hidden（readiness 404 不可见）/viewer-read-ok/viewer-write-forbidden 三步
  # 走 WAIVERS.md（multi-user-single-token）。
  - id: viewer-provision
    sql:
      statements:
        - |
          INSERT INTO sys_user (user_name, nick_name, password, status, del_flag, dept_id, utopia_uuid)
          VALUES ('contract_viewer', 'Contract Viewer',
                  '$2a$10$7JB720yubVSZvUI0rEqK/.VqGOZTH.ulu33dHOiBE8ByOhJIrdAu2', '0', '0', 103,
                  '0190d3e0-0000-7d5a-8000-00000000cafe')
          ON CONFLICT (utopia_uuid) DO NOTHING
        - |
          INSERT INTO sys_user_role (user_id, role_id)
          SELECT user_id, 2 FROM sys_user WHERE utopia_uuid = '0190d3e0-0000-7d5a-8000-00000000cafe'
          ON CONFLICT DO NOTHING
        - |
          SELECT utopia_uuid AS viewer_id FROM sys_user
           WHERE utopia_uuid = '0190d3e0-0000-7d5a-8000-00000000cafe'
      capture: { viewer_id: viewer_id }
  - id: kb-member-add-viewer
    call: 'PUT /api/v1/kbs/${kb_id}/members/${viewer_id} { "role": "viewer" }'
    expect: { status: 200 }
  - id: kb-members-two
    call: GET /api/v1/kbs/${kb_id}/members
    expect: { status: 200 }
  - id: ws-member-add-viewer
    call: 'PUT /api/v1/workspaces/${ws_id}/members/${viewer_id} { "role": "viewer" }'
    expect: { status: 200 }
  - id: ws-members-two
    call: GET /api/v1/workspaces/${ws_id}/members
    expect: { status: 200 }
  - id: ws-member-remove
    call: DELETE /api/v1/workspaces/${ws_id}/members/${viewer_id}
    expect: { status: 200 }
  - id: kb-member-remove
    call: DELETE /api/v1/kbs/${kb_id}/members/${viewer_id}
    expect: { status: 200 }
  - id: kb-members-after-remove
    call: GET /api/v1/kbs/${kb_id}/members
    expect: { status: 200 }
  - id: kb-audit
    call: GET /api/v1/kbs/${kb_id}/audit?limit=20&offset=0
    expect: { status: 200 }
  - id: kb-readiness
    call: GET /api/v1/kbs/${kb_id}/readiness
    expect: { status: 200 }
  # kb-export：RDF 响应按三元组集归一比对（Normalizer.triples——Turtle/JSON-LD 解析回 Model
  # 落排序 N-Triples 行；Jena 与 oxrdfio 序列化空白/前缀展开顺序天然不同，不按字节比）。
  - id: kb-export
    call: GET /api/v1/kbs/${kb_id}/export
    expect: { status: 200 }
  - id: kb-delete-default-refused
    call: DELETE /api/v1/kbs/${kb_id}
    expect: { status: 422 }
  - id: kb-create-second
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-wskb-second" }'
    capture: { kb2_id: body.id }
    expect: { status: 200 }
  - id: kb-delete-second
    call: DELETE /api/v1/kbs/${kb2_id}
    expect: { status: 200 }
  - id: kb-get-zero-404
    call: GET /api/v1/kbs/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
  - id: ws-get-zero-404
    call: GET /api/v1/workspaces/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
  # ---- 工作区设置族（LLM/OCR/转写，未配置态）----
  - id: ws-settings-get
    call: GET /api/v1/workspaces/${ws_id}/settings
    expect: { status: 200 }
  - id: ws-settings-put
    call: 'PUT /api/v1/workspaces/${ws_id}/settings {}'
    expect: { status: 200 }
  - id: ws-settings-ocr-put
    call: 'PUT /api/v1/workspaces/${ws_id}/settings/ocr { "provider": "mineru", "base_url": "http://127.0.0.1:1", "api_key": "contract-key", "backend": "contract-backend", "model": "contract-model" }'
    expect: { status: 200 }
  - id: ws-settings-transcribe-put
    call: 'PUT /api/v1/workspaces/${ws_id}/settings/transcribe { "base_url": "http://127.0.0.1:1", "api_key": "contract-key", "model": "contract-model" }'
    expect: { status: 200 }
  - id: ws-settings-test
    call: POST /api/v1/workspaces/${ws_id}/settings/test
    expect: { status: 200 }
  # ---- 收尾：删工作区（级联清掉专属库，幂等收口）----
  - id: ws-delete
    call: DELETE /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
