# 域：heart-ledger——心脏账本终态快照剧本骨架。
#
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）；
# 原 login 步（/api/v1/auth/login）随源仓 auth 域退役；kb 固定装置 SQL 从源仓 `users` 表
# 桥接到 jknow 身份（org=organizations 最老一行、user_id=sys_user.user_id=1 的 utopia_uuid
# ——与 UtopiaUuidResolver 的 org/admin 折算同口径），${run_id} 唯一后缀保留，每轮全新
# 工作空间/kb 不依赖历史。
#
# 挂账退役（WAIVERS.md，step-auth-override-dead）：push-statements 步——陈述推送以
# Authorization 头里的来源密钥鉴权（getHeader 取第一个头），引擎 bearer 会话恒占第一个头、
# 步级 Authorization 追加为第二头永远落空（实录已证 401）。推送死后本剧本剩骨架
# （装置+陈述源+快照），陈述信封证据待引擎步级鉴权扩展后恢复。
name: heart-ledger
desc: 心脏账本终态快照骨架（SQL 固定装置/陈述源/推送挂账退役/终态快照）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  # 固定装置（SQL，与侧无关）：组织（jknow 取 organizations 最老行，同业务面折算）下建工作
  # 空间 → kb（推理一周窗口+记过时戳）→ owner 成员资格 + kb_members 矩阵 admin。
  # 捕获 ws_id/kb_id/user_id 供后续步骤引用。
  - id: kb-fixture
    sql:
      statements:
        - |
          INSERT INTO workspaces (id, org_id, name)
          SELECT gen_random_uuid(),
                 (SELECT o.id FROM organizations o ORDER BY o.created_at LIMIT 1),
                 'ws-heart-${run_id}'
          RETURNING id AS ws_id
        - |
          INSERT INTO knowledge_bases (id, workspace_id, name, ontology_lang,
                                       inference_interval_minutes, last_inference_at)
          VALUES (gen_random_uuid(), '${ws_id}'::uuid, 'kb-heart-${run_id}', 'en', 10080, now())
          RETURNING id AS kb_id
        - |
          INSERT INTO memberships (user_id, workspace_id, role)
          SELECT (SELECT su.utopia_uuid FROM sys_user su WHERE su.user_id = 1),
                 '${ws_id}'::uuid, 'owner'
          RETURNING user_id AS user_id
        # kb 成员矩阵（写权限的唯一来源）：建库 HTTP 给创建者 admin，SQL 装置对等补上
        - |
          INSERT INTO kb_members (kb_id, user_id, role)
          VALUES ('${kb_id}'::uuid, '${user_id}'::uuid, 'admin')
      capture: { ws_id: ws_id, kb_id: kb_id, user_id: user_id }
  - id: statements-source
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-heart" }'
    capture:
      src_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
  # 挂账退役：push-statements（Bearer 来源密钥推送 0054 信封两条陈述）——见文件头与 WAIVERS.md
  # 终态快照：静默等待该 kb 的后台 job 后，直连共享 PG dump 默认心脏表集
  # （facts/entities/chunks 投影/documents 投影/errata 两表等，见 SnapshotTables 登记簿）。
  - id: ledger-snapshot
    snapshot: { kb_id: '${kb_id}' }
