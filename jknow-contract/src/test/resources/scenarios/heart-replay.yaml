# 域：heart-replay——观测回放闭合链（规格 §5；m3-plan 任务 11）。
#
# 语义：同一事实多次推送/撤回/恢复后时间线闭合正确（temporal 域）。写路径在测：
#   推送陈述 → 抽取 → 时间解析 → 物化（insert_fact_on 闭合分支族）→ 文档删除=事件 → 恢复。
#
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin）；login 步随源仓 auth 域退役；
# kb 固定装置 SQL 桥接 jknow 身份（organizations 最老行 + sys_user.user_id=1 的
# utopia_uuid，与业务面折算同口径），${run_id} 唯一后缀保留。
#
# 挂账退役（WAIVERS.md，step-auth-override-dead）：push-obs-1/2/3（Bearer 来源密钥推送——
# 引擎 bearer 恒占第一个 Authorization 头，步级覆盖落空，实录已证 401）及其下游
# find-obs-3-doc/delete-obs-3-doc/restore-obs-3-doc（撤回/恢复载体=推送文档，推送死后
# documents 空集、捕获必缺失）。本剧本剩装置（本体+短语绑定+物化 job）+快照骨架；
# 回放闭合链证据待引擎步级鉴权扩展后恢复。
name: heart-replay
desc: 观测回放闭合链（推送挂账退役后为装置+快照骨架）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: kb-fixture
    sql:
      statements:
        - |
          INSERT INTO workspaces (id, org_id, name)
          SELECT gen_random_uuid(),
                 (SELECT o.id FROM organizations o ORDER BY o.created_at LIMIT 1),
                 'ws-replay-${run_id}'
          RETURNING id AS ws_id
        - |
          INSERT INTO knowledge_bases (id, workspace_id, name, ontology_lang,
                                       inference_interval_minutes, last_inference_at)
          VALUES (gen_random_uuid(), '${ws_id}'::uuid, 'kb-replay-${run_id}', 'en', 10080, now())
          RETURNING id AS kb_id
        - |
          INSERT INTO memberships (user_id, workspace_id, role)
          SELECT (SELECT su.utopia_uuid FROM sys_user su WHERE su.user_id = 1),
                 '${ws_id}'::uuid, 'owner'
          RETURNING user_id AS user_id
        # kb 成员矩阵（写权限的唯一来源）：建库 HTTP 给创建者 admin，SQL 装置对等补上
        - |
          INSERT INTO kb_members (kb_id, user_id, role)
          VALUES ('${kb_id}'::uuid, '${user_id}'::uuid, 'admin')
      capture: { ws_id: ws_id, kb_id: kb_id, user_id: user_id }
  - id: statements-source
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-replay" }'
    capture:
      src_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
  # 本体写面：works_at 关系（state，无公理——公理变更属 heart-axioms 的戏份）
  - id: relation-works-at
    call: 'POST /api/v1/kbs/${kb_id}/ontology/relation-types { "key": "works_at", "label": "Works At", "temporal": "state" }'
    capture: { rel_id: body.id }
    expect: { status: 200 }
  # 挂账退役：push-obs-1/2/3（三份观测——开放段/有界段/另一断言）与下游
  # find-obs-3-doc/delete-obs-3-doc/restore-obs-3-doc（撤回/恢复链）——见文件头与 WAIVERS.md
  # 装置：短语绑定（'works_at'→works_at，forward，bound，marks='start'——#966：点陈述在
  # 状态属性下按「那一刻是开始」读）+ materialize_typed job 入队
  - id: bind-and-materialize-1
    sql:
      wait_quiet: '${kb_id}'
      statements:
        - |
          INSERT INTO phrase_bindings (id, kb_id, phrase, subject_type_id, object_type_id,
                                       object_is_value, relation_type_id, direction, status, marks, decided_by)
          VALUES (gen_random_uuid(), '${kb_id}'::uuid, 'works_at', NULL, NULL, false,
                  '${rel_id}'::uuid, 'forward', 'bound', 'start', 'person')
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize-1
    wait: { kb_id: '${kb_id}' }
  - id: wait-obs-2
    wait: { kb_id: '${kb_id}' }
  - id: materialize-2
    sql:
      wait_quiet: '${kb_id}'
      statements:
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize-2
    wait: { kb_id: '${kb_id}' }
  # 终态快照：facts（open/typed 两层）/time_mentions/entities/typed_fact_sources/documents
  # 投影等全表深度比对（推送退役后为空集现状骨架）
  - id: replay-snapshot
    snapshot: { kb_id: '${kb_id}' }
