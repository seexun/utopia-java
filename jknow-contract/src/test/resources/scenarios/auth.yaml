# 域：auth——无会话 401 扫描段（源仓口径在 jknow 的实形）。
#
# P3 golden 复活批（T2）处置（31 步 → 11 步，逐步实录定形，全表见任务 2 报告）：
#   setup 整段移除（原 ensure 走 /api/v1/auth/register——jknow 无该路由必失败；无 setup 即
#   全部步未认证，业务码闸（仅 ruoyi_login 剧本启用）不生效，(a) 处置才成立）。
#   (a) 未认证扫描步 10 步：jknow 未认证请求走若依认证入口点 renderString——HTTP 200 +
#       {"msg":"请求访问：<path>，认证失败，无法访问系统资源","code":401}（假 200 形）。
#       expect 显式声明 200（若依实形），体形状由 normalized 对表裁决（T3 Diff）。
#       保留 me-401：/api/v1/auth/me 路由虽退役，未认证探测仍经认证入口点返回同一假 200 形，
#       与其余扫描步同口径（auth 墙覆盖已退役路径也是契约事实）。
#   source-push-unknown-404 不变：sources/{id}/ingest 是匿名放行路由（来源密钥自鉴权），
#       未知源真 404 {"error":"Not found"}，与 golden 同形。
#   (b) 退役 20 步（删除 + COVERAGE.md 记退役 + WAIVERS.md 挂账 auth-retired）：
#       OIDC 四步（oidc-status/start/callback/exchange——/api/v1/auth/oidc/* 无路由）、
#       注册/登录错误分支五步（login-wrong-password/register-duplicate/bad-email/
#       short-password/missing-display-name——语义依赖 /api/v1/auth/* 业务码 409/422，
#       jknow 全部为无路由假 200 形，录了也只是路由缺失痕迹）、
#       会话段十一步（login/me/me-patch/me-patch-empty-name/password-wrong-current/
#       password-set-temp/password-revert/logout/me-after-logout/oidc-me/oidc-me-unlink）。
name: auth
desc: 无会话 401 扫描 11 步（jknow 假 200 实形 expect:200；OIDC/注册登录/会话段退役挂账）
steps:
  # ---- 无 cookie 401 扫描（jknow 实形：HTTP 200 + {"msg":...,"code":401} 假 200 形）----
  - id: me-401
    call: GET /api/v1/auth/me
    expect: { status: 200 }
  - id: alerts-401
    call: GET /api/v1/alerts?limit=5&offset=0
    expect: { status: 200 }
  - id: users-401
    call: GET /api/v1/users
    expect: { status: 200 }
  - id: workspaces-401
    call: GET /api/v1/workspaces
    expect: { status: 200 }
  - id: ontology-packs-401
    call: GET /api/v1/ontology-packs
    expect: { status: 200 }
  - id: kb-readiness-401
    call: GET /api/v1/kbs/00000000-0000-0000-0000-000000000000/readiness
    expect: { status: 200 }
  - id: kb-search-401
    call: 'POST /api/v1/kbs/00000000-0000-0000-0000-000000000000/search { "q": "x" }'
    expect: { status: 200 }
  - id: kb-export-401
    call: GET /api/v1/kbs/00000000-0000-0000-0000-000000000000/export
    expect: { status: 200 }
  - id: kb-mcp-401
    call: 'POST /api/v1/kbs/00000000-0000-0000-0000-000000000000/mcp { "jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {} }'
    expect: { status: 200 }
  - id: source-push-unknown-404
    call: 'POST /api/v1/sources/00000000-0000-0000-0000-000000000000/ingest { "filename": "a.txt", "content": "x" }'
    expect: { status: 404 }
  - id: jobs-noop-401
    call: POST /api/v1/jobs/noop
    expect: { status: 200 }
