# 域：chat-misc——对话（建会话级结构断言：无 chat 模型 → 422 no_chat_model 是合法黄金）
# + 会话列表/改名/详情/删除/停止的形状 + jobs/noop。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）。
# 三段退役（WAIVERS.md 挂账，见任务 2 报告）：
#   ①SSE 未认证 401 三步（kb-events/alerts-events/conversation-stream）——引擎无「去会话」机制，
#     bearer 会话下打 SSE 端点会挂流到超时（认证后的流 deferred 原口径不变）；
#   ②MCP JSON-RPC 三发 + PAT 现发/撤五步——步级 Authorization 永远是第二个头（服务端取第一个
#     =setup token，实录已证 401），PAT 路径步级覆盖不可达；且 PAT 现发会往 admin 的
#     personal_tokens 棘轮加行（打戳不删行），按 admin-pat-ratchet 同口径豁免；
#   ③原首步 login（/api/v1/auth/login）随源仓 auth 域退役（jknow 无路由）。
# 幂等：自建 ws-contract-chat / kb-contract-chat，收尾删除工作区级联收口。
name: chat-misc
desc: chat 422 现状+会话 CRUD 形状+noop（ruoyi admin；SSE/MCP/PAT 段挂账退役）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  # ---- 建库 → chat（无模型 422 是现状黄金）→ 会话面 ----
  - id: ws-create
    call: 'POST /api/v1/workspaces { "name": "ws-contract-chat" }'
    capture: { ws_id: body.id }
    expect: { status: 200 }
  - id: kb-create
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-chat", "description": "chat scenario" }'
    capture: { kb_id: body.id }
    expect: { status: 200 }
  - id: chat-no-model-422
    call: 'POST /api/v1/kbs/${kb_id}/chat { "message": "Which companies are mentioned?" }'
    expect: { status: 422 }
  - id: conversations-empty
    call: GET /api/v1/kbs/${kb_id}/conversations?limit=5&offset=0
    expect: { status: 200 }
  - id: conversations-search
    call: GET /api/v1/kbs/${kb_id}/conversations?q=nothing&limit=5&offset=0
    expect: { status: 200 }
  - id: conversation-detail-unknown-404
    call: GET /api/v1/kbs/${kb_id}/conversations/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
  - id: conversation-rename-unknown-404
    call: 'PATCH /api/v1/kbs/${kb_id}/conversations/00000000-0000-0000-0000-000000000000 { "title": "renamed" }'
    expect: { status: 404 }
  - id: conversation-delete-unknown-404
    call: DELETE /api/v1/kbs/${kb_id}/conversations/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
  - id: chat-stop-unknown-404
    call: 'POST /api/v1/kbs/${kb_id}/chat/00000000-0000-0000-0000-000000000000/stop { "generation_id": "00000000-0000-0000-0000-000000000000" }'
    expect: { status: 404 }
  # ---- 杂项：noop 入队（P0 队列验证端点）----
  - id: jobs-noop
    call: POST /api/v1/jobs/noop
    expect: { status: 200 }
  # ---- 收尾 ----
  - id: ws-delete
    call: DELETE /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
