# 域：sources-ingest——库内来源 CRUD（folder/api/statements）+ 库内 JSON 摄入 + 同步/重抽/运行历史/密钥轮换/缺文件清理。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）。
# 推送族九步退役（WAIVERS.md 挂账 step-auth-override-dead，见任务 2 报告）：
# push-created/unchanged/updated/stale-401/bogus-401 + statements-push-created/unchanged/
# unknown-key/wrong-kind-404——推送端点以 Authorization 头里的来源密钥鉴权
# （getHeader 取第一个头），引擎 bearer 会话恒占第一个头、步级 Authorization 追加为第二头
# 永远落空（实录已证 401）；引擎增步级鉴权覆盖（或推送端点收非 Authorization 通道）后恢复。
# 幂等：自建专属库 kb-contract-src，密钥轮换即时捕获使用，不依赖历史值；收尾删工作区级联收口。
name: sources-ingest
desc: 来源 CRUD+密钥面+kb ingest+sync/runs/轮换/清理（自建 kb-contract-src；推送族挂账退役）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: ws-create
    call: 'POST /api/v1/workspaces { "name": "ws-contract-src" }'
    capture: { ws_id: body.id }
    expect: { status: 200 }
  - id: kb-create
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-src", "description": "sources scenario" }'
    capture: { kb_id: body.id }
    expect: { status: 200 }
  - id: sources-empty
    call: GET /api/v1/kbs/${kb_id}/sources
    expect: { status: 200 }
  - id: folder-create
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "folder", "name": "src-contract-folder" }'
    capture: { folder_id: body.source.id }
    expect: { status: 200 }
  - id: api-create
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "api", "name": "src-contract-api" }'
    capture:
      api_id: body.source.id
      api_token0: body.ingest_token
    expect: { status: 200 }
  - id: statements-create
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-contract-statements" }'
    capture:
      stmt_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
  - id: sources-list-three
    call: GET /api/v1/kbs/${kb_id}/sources
    expect: { status: 200 }
  # ---- 来源密钥面 ----
  - id: folder-token-kind-mismatch-404
    call: GET /api/v1/kbs/${kb_id}/sources/${folder_id}/token
    expect: { status: 404 }
  - id: api-token
    call: GET /api/v1/kbs/${kb_id}/sources/${api_id}/token
    expect: { status: 200 }
  - id: api-rotate-token
    call: POST /api/v1/kbs/${kb_id}/sources/${api_id}/rotate-token
    capture: { api_token: body.ingest_token }
    expect: { status: 200 }
  # ---- 库内 JSON 摄入（用户会话路径，bearer 正常携带）----
  - id: kb-ingest-created
    call: 'POST /api/v1/kbs/${kb_id}/ingest { "filename": "ingest-a.txt", "content": "Dan left Delta Corp in 2019." }'
    expect: { status: 200 }
  - id: kb-ingest-unchanged
    call: 'POST /api/v1/kbs/${kb_id}/ingest { "filename": "ingest-a.txt", "content": "Dan left Delta Corp in 2019." }'
    expect: { status: 200 }
  - id: kb-ingest-empty-filename
    call: 'POST /api/v1/kbs/${kb_id}/ingest { "filename": "", "content": "x" }'
    expect: { status: 422 }
  # ---- 同步/重抽/运行历史/改名/删除 ----
  - id: folder-sync
    call: POST /api/v1/kbs/${kb_id}/sources/${folder_id}/sync
    expect: { status: 200 }
  - id: api-runs
    call: GET /api/v1/kbs/${kb_id}/sources/${api_id}/runs
    expect: { status: 200 }
  - id: folder-patch
    call: 'PATCH /api/v1/kbs/${kb_id}/sources/${folder_id} { "name": "src-contract-folder-renamed" }'
    expect: { status: 200 }
  - id: folder-re-extract
    call: POST /api/v1/kbs/${kb_id}/sources/${folder_id}/re-extract
    expect: { status: 200 }
  - id: missing-cleanup
    call: POST /api/v1/kbs/${kb_id}/sources/${folder_id}/missing/cleanup
    expect: { status: 200 }
  - id: folder-delete
    call: DELETE /api/v1/kbs/${kb_id}/sources/${folder_id}
    expect: { status: 200 }
  - id: folder-delete-again-404
    call: DELETE /api/v1/kbs/${kb_id}/sources/${folder_id}
    expect: { status: 404 }
  - id: sources-after-delete
    call: GET /api/v1/kbs/${kb_id}/sources
    expect: { status: 200 }
  # ---- 收尾 ----
  - id: ws-delete
    call: DELETE /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
