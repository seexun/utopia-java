# 域：graph——总览/邻域/实体检索/实体详情-改名/历史/证据/证明链/合并守卫/重建 + viewer 成员矩阵。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）。
# 幂等：自建专属库 kb-contract-graph，本体两类一谓词在剧本内自建；图恒为空（无模型抽取），
# 各端点返回空集形状确定。第二用户走 SQL 步预建（sys_user 固定 utopia_uuid + 复用 admin 的
# bcrypt 串 + sys_user_role 绑 role 2）——viewer-* 身份步（hidden-404/overview-ok/write-403/
# rebuild-403）因引擎单 token 模型不可达（服务端取第一个 Authorization 头=setup token，步级
# Authorization 追加为第二头永远落空，实录已证），按简报预案走 WAIVERS.md 挂账
# （multi-user-single-token，规格开放点见任务 2 报告）；成员矩阵两步以 admin 身份保留
# （PUT/DELETE members/${viewer_id}，viewer_id 由 SQL 捕获）。
# 原 /api/v1/auth/login|me 会话步（viewer-login/viewer-me/owner-login-back/viewer-login-again/
# owner-login-final）随源仓 auth 域退役（jknow 无路由），不再出现在剧本里。
name: graph
desc: 图谱视图族+实体端点族+证明链+重建 + 成员矩阵（自建 kb-contract-graph；viewer 预建不登录）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: ws-create
    call: 'POST /api/v1/workspaces { "name": "ws-contract-graph" }'
    capture: { ws_id: body.id }
    expect: { status: 200 }
  - id: kb-create
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-graph", "description": "graph scenario" }'
    capture: { kb_id: body.id }
    expect: { status: 200 }
  # 第二用户预建（SQL 装置，与侧无关、幂等）：固定 utopia_uuid 的 contract_viewer（口令串
  # 复用 admin 的 bcrypt 原文——同口令 admin123；绑普通角色 role 2；dept 103=迁移种子研发部）。
  # 之所以只建不登：引擎单 token 模型不支持第二身份（见文件头注记与 WAIVERS.md）。
  # 捕获 viewer_id（=固定 utopia_uuid）供成员矩阵两步引用。
  - id: viewer-provision
    sql:
      statements:
        - |
          INSERT INTO sys_user (user_name, nick_name, password, status, del_flag, dept_id, utopia_uuid)
          VALUES ('contract_viewer', 'Contract Viewer',
                  '$2a$10$7JB720yubVSZvUI0rEqK/.VqGOZTH.ulu33dHOiBE8ByOhJIrdAu2', '0', '0', 103,
                  '0190d3e0-0000-7d5a-8000-00000000cafe')
          ON CONFLICT (utopia_uuid) DO NOTHING
        - |
          INSERT INTO sys_user_role (user_id, role_id)
          SELECT user_id, 2 FROM sys_user WHERE utopia_uuid = '0190d3e0-0000-7d5a-8000-00000000cafe'
          ON CONFLICT DO NOTHING
        - |
          SELECT utopia_uuid AS viewer_id FROM sys_user
           WHERE utopia_uuid = '0190d3e0-0000-7d5a-8000-00000000cafe'
      capture: { viewer_id: viewer_id }
  - id: entity-type-create
    call: 'POST /api/v1/kbs/${kb_id}/ontology/entity-types { "key": "company", "label": "Company" }'
    capture: { et_id: body.id }
    expect: { status: 200 }
  - id: relation-type-create
    call: 'POST /api/v1/kbs/${kb_id}/ontology/relation-types { "key": "employs", "label": "Employs", "kind": "relation" }'
    expect: { status: 200 }
  # ---- 视图族（空图现状）----
  - id: graph-overview
    call: GET /api/v1/kbs/${kb_id}/graph/overview?limit=50
    expect: { status: 200 }
  - id: graph-overview-default-limit
    call: GET /api/v1/kbs/${kb_id}/graph/overview
    expect: { status: 200 }
  - id: entities-search
    call: GET /api/v1/kbs/${kb_id}/entities?q=Ac&limit=5
    expect: { status: 200 }
  - id: graph-neighborhood-unknown
    call: GET /api/v1/kbs/${kb_id}/graph/neighborhood?entity=00000000-0000-0000-0000-000000000000&hops=2
    expect: { status: 200 }
  # ---- 实体端点族（不存在的实体）----
  - id: entity-detail-404
    call: GET /api/v1/kbs/${kb_id}/entities/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
    # jknow 404 {"error":"Not found"} 与 golden（参照 require 后 NotFound）同形（T1 spike 已对表一致）
  - id: entity-patch-404
    call: 'PATCH /api/v1/kbs/${kb_id}/entities/00000000-0000-0000-0000-000000000000 { "canonical_name": "x" }'
    expect: { status: 404 }
  - id: entity-history-unknown
    call: GET /api/v1/kbs/${kb_id}/entities/00000000-0000-0000-0000-000000000000/history?page=0&per=10
    expect: { status: 200 }
  - id: fact-evidence-unknown
    call: GET /api/v1/kbs/${kb_id}/facts/00000000-0000-0000-0000-000000000000/evidence
    expect: { status: 200 }
  - id: derived-proof-unknown
    call: GET /api/v1/kbs/${kb_id}/derived/00000000-0000-0000-0000-000000000000/proof
    expect: { status: 200 }
  - id: blocked-proof-unknown
    call: GET /api/v1/kbs/${kb_id}/violations/00000000-0000-0000-0000-000000000000/proof
    expect: { status: 200 }
  - id: merge-distinct-unknown-404
    call: 'POST /api/v1/kbs/${kb_id}/entities/merge { "source": "00000000-0000-0000-0000-000000000000", "target": "00000000-0000-0000-0000-000000000001" }'
    expect: { status: 404 }
  - id: graph-rebuild
    call: POST /api/v1/kbs/${kb_id}/graph/rebuild
    expect: { status: 200 }
  # ---- viewer 成员矩阵（viewer 身份步已挂账豁免——见文件头）----
  # 原 viewer-kb-hidden-404 / viewer-overview-ok / viewer-entity-type-write-403 / viewer-rebuild-403
  # 四步走 WAIVERS.md（multi-user-single-token）；kb-member-add/remove 以 admin 身份保留：
  # 成员矩阵读面与写闭环仍是确定形状（jknow members 投影 {user_id,email,display_name,role}）。
  - id: kb-member-add-viewer
    call: 'PUT /api/v1/kbs/${kb_id}/members/${viewer_id} { "role": "viewer" }'
    expect: { status: 200 }
  - id: kb-member-remove
    call: DELETE /api/v1/kbs/${kb_id}/members/${viewer_id}
    expect: { status: 200 }
  # ---- 收尾 ----
  - id: ws-delete
    call: DELETE /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
