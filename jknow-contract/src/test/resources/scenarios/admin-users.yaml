# 域：admin-users——组织用户面 + 管理员面（admin 身份的实形）+ 个人访问令牌面。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin=user_id 1，即业务面 is_admin）——
# 源仓「非 admin 的 403 现状」在 jknow 变为 admin 实形：可读面 200、写端点大多未实装走
# 500 {"error":"Internal server error"}（实测无部分写：deployment PUT 后 GET 逐键不变、
# POST /admin/users 不落行）、OIDC 管理面 404。expect 逐步按实录实形改（对表裁决归 T3 Diff）。
# 两段退役（WAIVERS.md 挂账，见任务 2 报告）：
#   ①admin-ds-create-forbidden——admin 身份下是真建源（每轮写一行 data_sources，无对应
#     清理步），为保录制幂等不录，jknow 建源/删源实形已由探针验证（200/{"ok":true}）；
#   ②PAT 全生命周期五步——admin 是共享常驻账号，tokens 行只打戳不删行（issue 每轮加行）
#     即源仓 pat-ratchet 同款棘轮，tokens-list/tokens-list-after-issue 行数不再可构造钉死。
# 步 id 一律保留原名（与 golden 权威面 keys 对齐），形状变化写在步注释里。
name: admin-users
desc: /users 系 + /admin/* admin 实形（200/404/500）+ PAT 棘轮挂账退役（ruoyi admin）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  # ---- 组织用户面（admin 可读）----
  - id: users-list
    call: GET /api/v1/users
    expect: { status: 200 }
  - id: users-deactivated-forbidden
    # 原步语义（非 admin 403）不再成立：admin 可读 deactivated，jknow 实形 200 []
    call: GET /api/v1/users/deactivated
    expect: { status: 200 }
  # ---- 管理员面：admin 实形（写端点未实装走 500，无部分写——探针已证）----
  - id: admin-create-user-forbidden
    # jknow 实形 500 {"error":"Internal server error"}（确定性内部错误，不落行）
    call: 'POST /api/v1/admin/users { "email": "contract-made@test.local", "display_name": "Made", "password": "ContractMade!2026", "role": "viewer" }'
    expect: { status: 500 }
  - id: admin-deactivate-forbidden
    # 同上 500（未知 uuid，无写）
    call: DELETE /api/v1/admin/users/00000000-0000-0000-0000-000000000000
    expect: { status: 500 }
  - id: admin-reactivate-forbidden
    # 同上 500
    call: POST /api/v1/admin/users/00000000-0000-0000-0000-000000000000
    expect: { status: 500 }
  - id: admin-deployment-forbidden
    # admin 可读部署面，实形 200（open_registration/worker_concurrency 等固定配置值）
    call: GET /api/v1/admin/deployment
    expect: { status: 200 }
  - id: admin-deployment-put-forbidden
    # jknow 实形 500（PUT 未实装；实测 GET 前后逐键不变——无部分写）
    call: 'PUT /api/v1/admin/deployment { "open_registration": true }'
    expect: { status: 500 }
  - id: admin-oidc-identities-forbidden
    # jknow 无该路由，404 {"error":"Not found"}
    call: GET /api/v1/admin/oidc/identities
    expect: { status: 404 }
  - id: admin-oidc-unbind-forbidden
    call: DELETE /api/v1/admin/oidc/identities/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
  # ---- 管理员数据源面：读/测/删零值/授受零值都是 admin 实形 ----
  # 原 admin-ds-create-forbidden 挂账退役（真建源写态，见文件头）
  - id: admin-ds-list-forbidden
    # admin 可读，200 {"data_sources":[种子演示源]}（行内容确定性）
    call: GET /api/v1/admin/data-sources
    expect: { status: 200 }
  - id: admin-ds-test-forbidden
    # 探连测试不落库，200 {"ok":false,...127.0.0.1:1 refused...}（确定性失败文案）
    call: 'POST /api/v1/admin/data-sources/test { "conn_string": "postgres://127.0.0.1:1/x" }'
    expect: { status: 200 }
  - id: admin-ds-delete-forbidden
    # 未知源删除，404 {"error":"Not found"}
    call: DELETE /api/v1/admin/data-sources/00000000-0000-0000-0000-000000000000
    expect: { status: 404 }
  - id: admin-ds-grants-forbidden
    # admin 可读授权面，200 {"workspaces":[]}
    call: GET /api/v1/admin/data-sources/00000000-0000-0000-0000-000000000000/grants
    expect: { status: 200 }
  - id: admin-ds-grant-forbidden
    # PUT 授权未知源/工作区，500（FK 前置失败，无写）
    call: PUT /api/v1/admin/data-sources/00000000-0000-0000-0000-000000000000/grants/00000000-0000-0000-0000-000000000000
    expect: { status: 500 }
  - id: admin-ds-revoke-forbidden
    # 撤未知授权幂等，200 {"ok":true,"unmounted":0}
    call: DELETE /api/v1/admin/data-sources/00000000-0000-0000-0000-000000000000/grants/00000000-0000-0000-0000-000000000000
    expect: { status: 200 }
  # ---- 个人访问令牌：整段挂账退役（admin 共享账号棘轮，见文件头）----
  # 原 tokens-list / token-issue / tokens-list-after-issue / token-revoke / token-revoke-again-404
