# 域：heart-errata——M3 专属剧本②：勘误撤回物化跳过 + prov invalidatedAtTime（规格 §5）。
#
# 语义（0044 决定 7）：errata retract 落地后，物化不再从被撤的那对（陈述, 属性）算出类型化行
# ——due 查询的 errata_actions 跳过是物化侧 SQL 的组成部分；被撤的类型化行 invalidated_at 留痕
# （快照 facts 列可见，PROV 的 invalidatedAtTime 语义）。撤销要站得住：陈述还活着、绑定还在，
# 但那一对不再算出来——「这份文档撤的是它产生的那条，别的文档说了同一件事照样算」。
#
# M3/M4 边界说明：errata 的「agent 复审产生动作」是 errata_review job（LLM 循环）与
# decide_errata HTTP，均属 M4。本剧本以 SQL 造「撤回已生效」的前提（errata_runs/errata_actions
# 行 + 类型化行作废——即 errata.rs record→apply 落库的那两笔），被测写路径是**物化对该前提的
# 尊重**：再次物化（job 由写入侧 worker 消费——Rust materialize.rs / Java TypedMaterializeService）
# 不得把被撤的行再算出来。快照全表深度比对裁决两侧 due 查询跳过语义的等价。
#
# 链：kb 装置（SQL）→ works_at 本体（HTTP）→ 推送陈述（Acme based in London 自 2019）
# → 抽取/时间解析静默 → 短语绑定+物化 job（SQL）→ 静默 → 撤回前提（SQL：errata 两行
# + 类型化行 invalidated_at）→ 再次物化 job（SQL）→ 静默 → 快照。
name: heart-errata
desc: 勘误撤回物化跳过（errata_actions 跳过语义 + facts.invalidated_at 留痕的终态快照）
setup:
  register: { email: 'errata-${run_id}@test.local', password: Errata!2026x, display_name: Heart Errata }
steps:
  - id: login
    call: 'POST /api/v1/auth/login { "email": "${register.email}", "password": "${register.password}" }'
    capture: { cookie: set-cookie }
    expect: { status: 200 }
    target: rust
  - id: kb-fixture
    sql:
      statements:
        - |
          INSERT INTO workspaces (id, org_id, name)
          SELECT gen_random_uuid(), org_id, 'ws-errata-${run_id}' FROM users
           WHERE email = '${register.email}' RETURNING id AS ws_id
        - |
          INSERT INTO knowledge_bases (id, workspace_id, name, ontology_lang,
                                       inference_interval_minutes, last_inference_at)
          VALUES (gen_random_uuid(), '${ws_id}'::uuid, 'kb-errata-${run_id}', 'en', 10080, now())
          RETURNING id AS kb_id
        - |
          INSERT INTO memberships (user_id, workspace_id, role)
          SELECT id, '${ws_id}'::uuid, 'owner' FROM users
           WHERE email = '${register.email}' RETURNING user_id AS user_id
        # kb 成员矩阵（写权限的唯一来源——workspace owner 只给 open 库 Viewer）：
        # 建库 HTTP 会给创建者 admin，SQL 装置对等补上
        - |
          INSERT INTO kb_members (kb_id, user_id, role)
          VALUES ('${kb_id}'::uuid, '${user_id}'::uuid, 'admin')
      capture: { ws_id: ws_id, kb_id: kb_id, user_id: user_id }
  - id: statements-source
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-errata" }'
    capture:
      src_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
    target: rust
  - id: relation-based-in
    call: 'POST /api/v1/kbs/${kb_id}/ontology/relation-types { "key": "based_in", "label": "Based In", "temporal": "state" }'
    capture: { rel_id: body.id }
    expect: { status: 200 }
    target: rust
  # 陈述：Acme based in London 自 2019（London 落字面值宾语——不在 e 里的宾语按契约落
  # object_value；签名两端类 NULL，与未绑类别词的 Acme 实体相配）
  - id: push-obs-1
    call: 'POST /api/v1/sources/${src_id}/statements { "external_id": "errata-1", "e": [["Acme", "organization", null]], "s": [[null, "Acme", "based in", null, "London", null, "2019-06-01", null]], "n": [] }'
    headers: { Authorization: 'Bearer ${stmt_token}' }
    expect: { status: 200 }
    target: rust
  # 装置：绑定（object_is_value=true 匹配字面值宾语；marks='start'——只说了一刻的 when
  # 读成点，#966：状态属性下点陈述按「那一刻是开始」读才有类型化行）+ 物化 job；
  # 静默后类型化行落地
  - id: bind-and-materialize-1
    sql:
      wait_quiet: '${kb_id}'
      statements:
        - |
          INSERT INTO phrase_bindings (id, kb_id, phrase, subject_type_id, object_type_id,
                                       object_is_value, relation_type_id, direction, status, marks, decided_by)
          VALUES (gen_random_uuid(), '${kb_id}'::uuid, 'based in', NULL, NULL, true,
                  '${rel_id}'::uuid, 'forward', 'bound', 'start', 'person')
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize-1
    wait: { kb_id: '${kb_id}' }
  # 撤回前提（SQL=errata.rs record→apply 的两笔落库，0044 决定 7）：
  #   errata_runs（一份文档一次复审的账）+ errata_actions（retract/applied，
  #   statement_id=开放陈述、predicate_id=based_in、fact_id=被撤的类型化行——
  #   物化 due 查询按（statement, predicate）跳过的就是这对）；
  #   类型化行打 invalidated_at（被撤的那条不再活着——PROV invalidatedAtTime 的库内形状）。
  #   陈述与绑定保持活着：这正是「撤销要站得住」要测的前提。
  - id: errata-retract-applied
    sql:
      statements:
        - |
          INSERT INTO errata_runs (id, kb_id, document_id, flagged, sampled)
          SELECT gen_random_uuid(), '${kb_id}'::uuid, d.id, 1, 0
            FROM documents d WHERE d.kb_id = '${kb_id}'::uuid AND d.filename = 'errata-1.json'
          RETURNING id AS run_id
        - |
          INSERT INTO errata_actions (id, kb_id, run_id, document_id, fact_id, statement_id,
                                      predicate_id, flag, action, reason, quote, status)
          SELECT gen_random_uuid(), '${kb_id}'::uuid, '${run_id}'::uuid, r.document_id,
                 t.id AS fact_id, t.from_statement_id AS statement_id,
                 '${rel_id}'::uuid, 'range', 'retract', 'not in the document', 'based in', 'applied'
            FROM errata_runs r, facts t
           WHERE r.id = '${run_id}'::uuid
             AND t.kb_id = '${kb_id}'::uuid AND t.layer = 'typed'
             AND t.predicate_id = '${rel_id}'::uuid AND t.invalidated_at IS NULL
          RETURNING id AS action_id
        - |
          UPDATE facts SET invalidated_at = now()
           WHERE kb_id = '${kb_id}'::uuid AND layer = 'typed'
             AND predicate_id = '${rel_id}'::uuid AND invalidated_at IS NULL
      capture: { run_id: run_id, action_id: action_id }
  # 再次物化（job 由写入侧 worker 消费）：被撤的（陈述, 属性）不得再算出来——
  # 陈述活着、绑定 bound，若跳过语义缺失会补出一条活行，快照立判
  - id: materialize-2
    sql:
      statements:
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize-2
    wait: { kb_id: '${kb_id}' }
  # 终态快照：facts（开放陈述活着 + 类型化行 invalidated_at 留痕）/errata_actions/
  # errata_runs/typed_fact_sources（指向已作废行的来源链）——撤回跳过语义的终态裁决
  - id: errata-snapshot
    snapshot: { kb_id: '${kb_id}' }
