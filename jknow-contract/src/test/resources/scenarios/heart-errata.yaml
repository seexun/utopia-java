# 域：heart-errata——勘误撤回物化跳过 + prov invalidatedAtTime（规格 §5）。
#
# 语义（0044 决定 7）：errata retract 落地后，物化不再从被撤的那对（陈述, 属性）算出类型化行
# ——due 查询的 errata_actions 跳过是物化侧 SQL 的组成部分；被撤的类型化行 invalidated_at 留痕
# （快照 facts 列可见，PROV 的 invalidatedAtTime 语义）。
#
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin）；login 步随源仓 auth 域退役；
# kb 固定装置 SQL 桥接 jknow 身份（organizations 最老行 + sys_user.user_id=1 的
# utopia_uuid，与业务面折算同口径），${run_id} 唯一后缀保留。
#
# 挂账退役（WAIVERS.md，step-auth-override-dead）：push-obs-1（Bearer 来源密钥推送——引擎
# bearer 恒占第一个 Authorization 头，步级覆盖落空，实录已证 401）与其下游
# errata-retract-applied（errata_runs 按推送文档 errata-1.json 定位、errata_actions 引用
# 推生产生的类型化行——推送死后两 INSERT..SELECT 空集，捕获必缺失）——撤回跳过语义的
# 前提随之失供，本剧本剩装置+快照骨架；证据待引擎步级鉴权扩展后恢复。
name: heart-errata
desc: 勘误撤回物化跳过（推送挂账退役后为装置+快照骨架）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: kb-fixture
    sql:
      statements:
        - |
          INSERT INTO workspaces (id, org_id, name)
          SELECT gen_random_uuid(),
                 (SELECT o.id FROM organizations o ORDER BY o.created_at LIMIT 1),
                 'ws-errata-${run_id}'
          RETURNING id AS ws_id
        - |
          INSERT INTO knowledge_bases (id, workspace_id, name, ontology_lang,
                                       inference_interval_minutes, last_inference_at)
          VALUES (gen_random_uuid(), '${ws_id}'::uuid, 'kb-errata-${run_id}', 'en', 10080, now())
          RETURNING id AS kb_id
        - |
          INSERT INTO memberships (user_id, workspace_id, role)
          SELECT (SELECT su.utopia_uuid FROM sys_user su WHERE su.user_id = 1),
                 '${ws_id}'::uuid, 'owner'
          RETURNING user_id AS user_id
        # kb 成员矩阵（写权限的唯一来源）：建库 HTTP 给创建者 admin，SQL 装置对等补上
        - |
          INSERT INTO kb_members (kb_id, user_id, role)
          VALUES ('${kb_id}'::uuid, '${user_id}'::uuid, 'admin')
      capture: { ws_id: ws_id, kb_id: kb_id, user_id: user_id }
  - id: statements-source
    call: 'POST /api/v1/kbs/${kb_id}/sources { "kind": "statements", "name": "src-errata" }'
    capture:
      src_id: body.source.id
      stmt_token: body.ingest_token
    expect: { status: 200 }
  - id: relation-based-in
    call: 'POST /api/v1/kbs/${kb_id}/ontology/relation-types { "key": "based_in", "label": "Based In", "temporal": "state" }'
    capture: { rel_id: body.id }
    expect: { status: 200 }
  # 挂账退役：push-obs-1（Acme based in London 自 2019——London 落字面值宾语）与下游
  # errata-retract-applied（撤回前提两笔落库）——见文件头与 WAIVERS.md
  # 装置：绑定（object_is_value=true 匹配字面值宾语；marks='start'）+ 物化 job
  - id: bind-and-materialize-1
    sql:
      wait_quiet: '${kb_id}'
      statements:
        - |
          INSERT INTO phrase_bindings (id, kb_id, phrase, subject_type_id, object_type_id,
                                       object_is_value, relation_type_id, direction, status, marks, decided_by)
          VALUES (gen_random_uuid(), '${kb_id}'::uuid, 'based in', NULL, NULL, true,
                  '${rel_id}'::uuid, 'forward', 'bound', 'start', 'person')
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize-1
    wait: { kb_id: '${kb_id}' }
  # 再次物化（job 由写入侧 worker 消费）——原语义测「被撤的（陈述, 属性）不得再算出来」，
  # 撤回前提随推送退役失供，此步保留物化触发面
  - id: materialize-2
    sql:
      statements:
        - |
          INSERT INTO jobs (kind, payload, max_attempts)
          VALUES ('materialize_typed', jsonb_build_object('kb_id', '${kb_id}'), 3)
      capture: {}
  - id: wait-materialize-2
    wait: { kb_id: '${kb_id}' }
  # 终态快照：facts/errata_actions/errata_runs/typed_fact_sources——撤回跳过语义的终态裁决
  # （推送退役后为空集现状骨架）
  - id: errata-snapshot
    snapshot: { kb_id: '${kb_id}' }
