# 登录链路剧本：P3 golden 复活批（T2）按 T1 spike 定形——源仓 auth-login 的 login/me 步
# 随 P1 auth 域退役（/api/v1/auth/login、/api/v1/auth/me 已不存在，jknow 无路由）：
# 两步删除 + COVERAGE.md 记退役 + WAIVERS.md 挂账 auth-retired（Diff 对表时左侧遗留豁免）。
# 仅存的读面 graph-404 与 spike（T1 三族复验）一致：setup 走引擎 ruoyi_login 模式
# （POST /login 捕 token，Bearer 引擎默认注入），不存在的库 404 {"error":"Not found"}。
name: auth-login
desc: 登录链路退役后仅存的读面——不存在的库 404（对表源 golden-java/rust 同名步）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  # 注意：call 行带 JSON 体时用单引号包裹——YAML plain 标量不能含「冒号+空格」。
  - id: graph-404
    call: GET /api/v1/kbs/00000000-0000-0000-0000-000000000000/graph/overview
    expect: { status: 404 }
