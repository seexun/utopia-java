# 域：search——库内检索（源仓 M1 任务 6：Java 侧 ES+IK 等价实现）。
# P3 golden 复活批（T2）：setup 换 ruoyi_login（若依 admin，Bearer 会话引擎默认注入）；
# 单打录制下 ingest/search 步按普通步执行（worker 在服务端消费 job，wait 步静默兜底）。
# 无嵌入模型=纯 BM25 现状。
name: search
desc: POST search 命中/no-match/缺 q 422/未知库 404 + 实体检索空集（自建 kb-contract-search）
setup:
  mode: ruoyi_login
  username: admin
  password: admin123
steps:
  - id: ws-create
    call: 'POST /api/v1/workspaces { "name": "ws-contract-search" }'
    capture: { ws_id: body.id }
    expect: { status: 200 }
    target: rust
  - id: kb-create
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-search", "description": "search scenario" }'
    capture: { kb_id: body.id }
    expect: { status: 200 }
    target: rust
  - id: ingest-doc
    call: 'POST /api/v1/kbs/${kb_id}/ingest { "filename": "searchable.txt", "content": "Eve works at Acme Corp." }'
    expect: { status: 200 }
    target: java
  - id: wait-ingest
    wait: { kb_id: '${kb_id}' }
  - id: search-known-term
    call: 'POST /api/v1/kbs/${kb_id}/search { "q": "Acme" }'
    expect: { status: 200 }
    target: java
  - id: search-no-match
    call: 'POST /api/v1/kbs/${kb_id}/search { "q": "zzz-no-such-term" }'
    expect: { status: 200 }
  - id: search-missing-q-422
    call: 'POST /api/v1/kbs/${kb_id}/search {}'
    expect: { status: 422 }
  - id: search-unknown-kb-404
    call: 'POST /api/v1/kbs/00000000-0000-0000-0000-000000000000/search { "q": "x" }'
    expect: { status: 404 }
  - id: entities-search-empty
    call: GET /api/v1/kbs/${kb_id}/entities?q=Zz&limit=3
    expect: { status: 200 }
  - id: ws-delete
    call: DELETE /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
    target: rust
