# 域：search——库内检索（M1 任务 6：Java 侧 ES+IK 等价实现，语义等价集评审）。
# M5 任务 6 重定位（fulltext-store-ownership 挂账核销）：两实现各持私有全文存储——
# Rust 检索走进程内 Tantivy，Java 检索走共享 ES utopia-kb-{id}（M1 架构）。ingest 步
# 与 search-known-term 步均 target:java 单侧验证：java 轮（Java worker 持写路径）
# ES 索引自持建成、search 真命中（见 golden-java/search/search-known-term.json 的
# 命中样本）；缺省双打轮 Java worker 关（共享 job 由 Rust 消费进 Tantivy 不进 ES），
# 该步在 Java 侧为空集样本——单侧步不参与双打比对（语义等价的双空集步
# search-no-match 仍正常比对）。无嵌入模型=纯 BM25 现状。
name: search
desc: POST search 命中/no-match/缺 q 422/未知库 404 + 实体检索空集（自建 kb-contract-search）
setup:
  register: { email: contract-search@test.local, password: ContractSearch!2026, display_name: Contract Search }
steps:
  - id: ws-create
    call: 'POST /api/v1/workspaces { "name": "ws-contract-search" }'
    capture: { ws_id: body.id }
    expect: { status: 200 }
    target: rust
  - id: kb-create
    call: 'POST /api/v1/workspaces/${ws_id}/kbs { "name": "kb-contract-search", "description": "search scenario" }'
    capture: { kb_id: body.id }
    expect: { status: 200 }
    target: rust
  - id: ingest-doc
    call: 'POST /api/v1/kbs/${kb_id}/ingest { "filename": "searchable.txt", "content": "Eve works at Acme Corp." }'
    expect: { status: 200 }
    target: java
  - id: wait-ingest
    wait: { kb_id: '${kb_id}' }
  - id: search-known-term
    call: 'POST /api/v1/kbs/${kb_id}/search { "q": "Acme" }'
    expect: { status: 200 }
    target: java
  - id: search-no-match
    call: 'POST /api/v1/kbs/${kb_id}/search { "q": "zzz-no-such-term" }'
    expect: { status: 200 }
  - id: search-missing-q-422
    call: 'POST /api/v1/kbs/${kb_id}/search {}'
    expect: { status: 422 }
  - id: search-unknown-kb-404
    call: 'POST /api/v1/kbs/00000000-0000-0000-0000-000000000000/search { "q": "x" }'
    expect: { status: 404 }
  - id: entities-search-empty
    call: GET /api/v1/kbs/${kb_id}/entities?q=Zz&limit=3
    expect: { status: 200 }
  - id: ws-delete
    call: DELETE /api/v1/workspaces/${ws_id}
    expect: { status: 200 }
    target: rust
